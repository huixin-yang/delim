<!doctype html>
<html>
  <head>
    <title>Delimiter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <h2>Text Delimiter</h2>
      <textarea
        id="inputText"
        placeholder="Enter text to delimit..."
      ></textarea>
      <div class="delimiter-options">
        <div class="delimiter-row">
          <label>From:</label>
          <div class="delimiter-buttons" id="fromDelimiters">
            <button class="delimiter-button" data-value=",">,</button>
            <button class="delimiter-button" data-value=";">;</button>
            <button class="delimiter-button" data-value="|">|</button>
            <button class="delimiter-button" data-value="\t">\t</button>
            <button class="delimiter-button" data-value="\n">\n</button>
          </div>
          <input
            type="text"
            id="fromDelimiterCustom"
            class="custom-input"
            placeholder="Enter custom delimiter"
          />
        </div>
        <div class="delimiter-row">
          <label>To:</label>
          <div class="delimiter-buttons" id="toDelimiters">
            <button class="delimiter-button" data-value=",">,</button>
            <button class="delimiter-button" data-value=";">;</button>
            <button class="delimiter-button" data-value="|">|</button>
            <button class="delimiter-button" data-value="\t">\t</button>
            <button class="delimiter-button" data-value="\n">\n</button>
          </div>
          <input
            type="text"
            id="toDelimiterCustom"
            class="custom-input"
            placeholder="Enter custom delimiter"
          />
        </div>
        <div class="delimiter-row">
          <label>Quote Type:</label>
          <div class="delimiter-buttons" id="quoteButtons">
            <button class="delimiter-button" data-type="none">No Quotes</button>
            <button class="delimiter-button" data-type="single">' '</button>
            <button class="delimiter-button" data-type="double">" "</button>
          </div>
        </div>
        <div class="delimiter-row">
          <label>Duplicates Handling</label>
          <div class="delimiter-buttons" id="duplicatesHandling">
            <button
              class="delimiter-button"
              data-type="keep-duplicates"
              title="Keep all duplicates"
            >
              Allow Duplicates
            </button>
            <button
              class="delimiter-button"
              data-type="remove-duplicates"
              title="Remove duplicate lines/items"
            >
              Remove Duplicates
            </button>
          </div>
        </div>
      </div>
      <button id="delimitButton">Convert Text</button>
      <div class="result-container">
        <div class="result" id="result"></div>
        <button class="copy-button" id="copyButton">Copy Result</button>
      </div>
      <div class="debug-info" id="debugInfo"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
